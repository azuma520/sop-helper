# Dredd API Contract Testing Configuration
# Tests API implementation against OpenAPI specification

language: node
sandbox: false
require: []
before:
  hooks: []
after:
  hooks: []

reporter:
  - api
  - cli

output:
  - ./dredd-report.md

# OpenAPI specification location
